# Ignite auth-correctness rules — real vulnerabilities, not the
# Compliance & Feature Posture Engine's presence-only classifier
# (ignite-posture-rules.yaml). These fire as regular semantic-sast issues
# (blocking/warning) through the same checkSemanticSast path — see
# server.js's SEMGREP_CONFIG default, which appends this file's path
# alongside the p/security-audit and p/owasp-top-ten registry packs.
#
# Scope: p/security-audit already catches the *obvious* JWT/session bugs
# (jwt.sign()/jwt.verify() with a hardcoded secret, an explicit
# algorithms: ['none'], express-session's cookie-flag defaults) — verified
# against a real fixture before writing this file, not assumed. What it
# does NOT catch is covered here: algorithm-confusion — a jwt.verify()/
# jwt.decode() call with no `algorithms` allowlist at all is vulnerable to
# an RS256-signed token being replayed as HS256 if the public key is ever
# available to an attacker as a potential HMAC secret. Real Semgrep AST
# patterns (pattern/pattern-not), not the posture engine's generic
# pattern-regex — intraprocedural (single call site), squarely within
# what Semgrep OSS's engine can reliably do without cross-file taint
# tracking.
#
# A third rule (session-fixation: session data written post-login without
# first calling req.session.regenerate()) was drafted and dropped — it
# false-positived on the textbook-correct idiom
# (session.regenerate(callback) with the write *inside* the callback),
# because Semgrep OSS's pattern-not can't see across that nested-function
# boundary to confirm regenerate was actually called. Shipping a rule that
# flags safe code as vulnerable is worse than not having the check —
# recorded here so a future attempt doesn't reinvent the same dead end
# without cross-file/interprocedural analysis (Semgrep Pro/CodeQL).

rules:
  - id: jwt-verify-missing-algorithms-js
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      jwt.verify() called without an explicit `algorithms` allowlist —
      vulnerable to algorithm-confusion attacks (e.g. an RS256-signed
      token replayed as HS256 using the public key as the HMAC secret) if
      the verifying key/secret is ever derived from or shared with a
      public key elsewhere in the app. Pass `{ algorithms: ['RS256'] }`
      (or whichever single algorithm the app actually issues) explicitly.
    metadata:
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://owasp.org/www-project-top-ten/2017/A2_2017-Broken_Authentication
        - https://auth0.com/blog/critical-vulnerabilities-in-json-web-token-libraries/
    patterns:
      - pattern-either:
          - pattern: jwt.verify($TOKEN, $KEY)
          - pattern: jwt.verify($TOKEN, $KEY, $CB)
      - pattern-not: "jwt.verify($TOKEN, $KEY, { algorithms: [...], ... })"
      - pattern-not: "jwt.verify($TOKEN, $KEY, { algorithms: [...], ... }, $CB)"

  - id: pyjwt-decode-missing-algorithms
    languages: [python]
    severity: WARNING
    message: >-
      jwt.decode() called without an explicit `algorithms` allowlist —
      the same algorithm-confusion risk as the JS jwt.verify() case above.
      Pass `algorithms=["RS256"]` (or whichever single algorithm the app
      actually issues) explicitly.
    metadata:
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      owasp: ["A02:2021 - Cryptographic Failures"]
    patterns:
      - pattern: jwt.decode($TOKEN, $KEY, ...)
      - pattern-not: jwt.decode($TOKEN, $KEY, ..., algorithms=[...], ...)
      - pattern-not: jwt.decode($TOKEN, $KEY, ..., algorithms=$ALGS, ...)
