[package]
name = "ignite-llm-deep-scan"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-fs-utils = { path = "../fs-utils" }
ignite-llm-client = { path = "../llm-client" }
ignite-db-store = { path = "../db-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
