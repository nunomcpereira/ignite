[package]
name = "ignite-codeql-cross-file"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-fs-utils = { path = "../fs-utils" }
ignite-tool-runner = { path = "../tool-runner" }
ignite-db-store = { path = "../db-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
tokio = { version = "1", features = ["fs"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
