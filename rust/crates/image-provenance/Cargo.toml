[package]
name = "ignite-image-provenance"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-fs-utils = { path = "../fs-utils" }
ignite-tool-runner = { path = "../tool-runner" }
ignite-db-store = { path = "../db-store" }
serde = { version = "1", features = ["derive"] }
once_cell = "1"
regex = "1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
