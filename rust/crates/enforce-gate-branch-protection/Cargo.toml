[package]
name = "ignite-enforce-gate-branch-protection"
edition.workspace = true
version.workspace = true

[[bin]]
name = "enforce-gate-branch-protection"
path = "src/main.rs"

[dependencies]
ignite-github-api = { path = "../github-api" }
ignite-tool-runner = { path = "../tool-runner" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
