[package]
name = "ignite-github-api"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-tool-runner = { path = "../tool-runner" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"
tempfile = "3"
flate2 = "1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
