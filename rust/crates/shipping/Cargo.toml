[package]
name = "ignite-shipping"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-tool-runner = { path = "../tool-runner" }
ignite-github-api = { path = "../github-api" }
ignite-db-store = { path = "../db-store" }
once_cell = "1"
regex = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
