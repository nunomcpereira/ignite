[package]
name = "ignite-auth"
edition.workspace = true
version.workspace = true

[dependencies]
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
regex = "1"
once_cell = "1"
rand_core = { version = "0.6", features = ["std"] }
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
