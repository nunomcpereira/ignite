[package]
name = "ignite-pipeline-core"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-fs-utils = { path = "../fs-utils" }
ignite-tool-runner = { path = "../tool-runner" }
ignite-auth = { path = "../auth" }
ignite-db-store = { path = "../db-store" }
ignite-override-engine = { path = "../override-engine" }
ignite-dependency-license-scan = { path = "../dependency-license-scan" }
ignite-deps-dev-client = { path = "../deps-dev-client" }
ignite-governance-ci = { path = "../governance-ci" }
ignite-github-api = { path = "../github-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
