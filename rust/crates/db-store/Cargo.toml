[package]
name = "ignite-db-store"
edition.workspace = true
version.workspace = true

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
parking_lot = "0.12"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
sha2 = "0.10"
thiserror = "2"
flate2 = "1"
ignite-override-engine = { path = "../override-engine" }
ignite-run-lifecycle = { path = "../run-lifecycle" }

[dev-dependencies]
tempfile = "3"
