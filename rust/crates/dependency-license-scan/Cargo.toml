[package]
name = "ignite-dependency-license-scan"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-override-engine = { path = "../override-engine" }
ignite-fs-utils = { path = "../fs-utils" }
ignite-tool-runner = { path = "../tool-runner" }
ignite-studio-manifests = { path = "../studio-manifests" }
ignite-deps-dev-client = { path = "../deps-dev-client" }
ignite-license-classification = { path = "../license-classification" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
