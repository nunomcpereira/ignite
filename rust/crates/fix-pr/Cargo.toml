[package]
name = "ignite-fix-pr"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-fs-utils = { path = "../fs-utils" }
ignite-github-api = { path = "../github-api" }
ignite-staging = { path = "../staging" }
ignite-llm-client = { path = "../llm-client" }
ignite-tool-runner = { path = "../tool-runner" }
ignite-pipeline-gate = { path = "../pipeline-gate" }
futures = "0.3"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
serde_yaml = "0.9.34"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
