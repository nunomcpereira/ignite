[package]
name = "ignite-auto-fix-pr"
edition.workspace = true
version.workspace = true

[[bin]]
name = "auto-fix-pr"
path = "src/main.rs"

[dependencies]
ignite-deps-dev-client = { path = "../deps-dev-client" }
ignite-dependency-license-scan = { path = "../dependency-license-scan" }
ignite-github-api = { path = "../github-api" }
ignite-tool-runner = { path = "../tool-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
