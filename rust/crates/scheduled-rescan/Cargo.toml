[package]
name = "ignite-scheduled-rescan"
edition.workspace = true
version.workspace = true

[[bin]]
name = "scheduled-rescan"
path = "src/main.rs"

[dependencies]
ignite-db-store = { path = "../db-store" }
ignite-github-api = { path = "../github-api" }
ignite-tool-runner = { path = "../tool-runner" }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"

[dev-dependencies]
axum = "0.7"
