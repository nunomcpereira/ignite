[package]
name = "ignite-sast-bench"
edition.workspace = true
version.workspace = true

[lib]
name = "ignite_sast_bench"
path = "src/lib.rs"

[[bin]]
name = "sast-bench"
path = "src/main.rs"

[dependencies]
ignite-override-engine = { path = "../override-engine" }
ignite-policy = { path = "../policy" }
ignite-phase4-orchestrator = { path = "../phase4-orchestrator" }
ignite-db-store = { path = "../db-store" }
ignite-staging = { path = "../staging" }
ignite-tool-runner = { path = "../tool-runner" }
ignite-package-hallucination = { path = "../package-hallucination" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing-subscriber = "0.3"
