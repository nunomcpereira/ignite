[package]
name = "ignite-guidelines-api"
edition.workspace = true
version.workspace = true

[[bin]]
name = "guidelines-api"
path = "src/main.rs"

[dependencies]
ignite-guidelines = { path = "../guidelines" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
