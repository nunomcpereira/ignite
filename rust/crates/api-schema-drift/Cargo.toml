[package]
name = "ignite-api-schema-drift"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-fs-utils = { path = "../fs-utils" }
ignite-tool-runner = { path = "../tool-runner" }
ignite-api-schema = { path = "../api-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
