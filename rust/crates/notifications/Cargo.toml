[package]
name = "ignite-notifications"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-config = { path = "../config" }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "sendmail-transport", "builder", "hostname"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
