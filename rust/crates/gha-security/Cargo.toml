[package]
name = "ignite-gha-security"
edition.workspace = true
version.workspace = true

[dependencies]
ignite-fs-utils = { path = "../fs-utils" }
ignite-tool-runner = { path = "../tool-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
