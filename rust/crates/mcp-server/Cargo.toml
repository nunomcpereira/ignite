[package]
name = "ignite-mcp-server"
edition.workspace = true
version.workspace = true

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
ignite-guidelines = { path = "../guidelines" }
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros", "schemars", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
urlencoding = "2"
anyhow = "1"
axum = "0.7"
tower-service = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
